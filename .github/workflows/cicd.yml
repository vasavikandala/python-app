name: cicd

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      -   name: Shorten commit id
          shell: bash
          run: |
            echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      -   name: Checkout code
          uses: actions/checkout@v4

      -  name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v3

      -   name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

      -   name: Build and push Docker image
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: vasavi2002/python-app:${{ env.COMMIT_ID }}
    outputs:
      commit_id: ${{ env.COMMIT_ID}}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Modify values file
        shell: bash
        run:
          echo ${{ needs.ci.outputs.commits_id}}
          pip install yq
          yq -Yi '.image.tag = "${{ needs.ci.outputs.commits_id}}"' charts/python-app/values.yaml

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          
          message: 'Update values.yaml with commit ${{ needs.ci.outputs.commits_id}}'
        

      - name: Install Argo CD CLI
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd /usr/local/bin/argocd
          argocd version --client


      - name: ArgoCD app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password "${{ secrets.ARGOCD_PASSWORD }}"
          argocd app sync python-app